[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "null-claw"
version = "0.1.0"
description = "A local automation CLI agent without LLM/API dependencies"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "rich>=13.0.0",
    "colorama>=0.4.6",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "pyautogui>=0.9.54",
]

[project.scripts]
null-claw = "null_claw.main:main"

[tool.setuptools.packages.find]
where = ["src"]
